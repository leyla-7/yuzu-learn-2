name: Technical foundation CI

on:
  push:
    branches:
      - main
      - work-yuzu-054-technical-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify foundation
        run: npm run check

      - name: Capture Lesson 1 browser evidence
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "No Chrome/Chromium binary found on runner" >&2
            exit 1
          fi

          mkdir -p browser-evidence
          python3 -m http.server 4173 -d dist >/tmp/yuzu-http.log 2>&1 &
          HTTP_PID=$!
          "$CHROME_BIN"             --headless=new             --no-sandbox             --disable-dev-shm-usage             --remote-debugging-port=9222             --user-data-dir=/tmp/yuzu-chrome             about:blank >/tmp/yuzu-chrome.log 2>&1 &
          CHROME_PID=$!

          cleanup() {
            kill "$HTTP_PID" "$CHROME_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          node scripts/browser-evidence.mjs

      - name: Upload browser build
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lesson1-browser-build
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser evidence
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lesson1-browser-evidence
          path: browser-evidence
          if-no-files-found: error
          retention-days: 7
