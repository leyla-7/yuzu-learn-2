name: Technical foundation CI

on:
  push:
    branches:
      - main
      - work-yuzu-054-technical-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify foundation
        run: npm run check

      - name: Upload browser build
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lesson1-browser-build
          path: dist
          if-no-files-found: error
          retention-days: 7
