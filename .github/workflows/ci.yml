name: Technical foundation CI

on:
  push:
    branches:
      - main
      - work-yuzu-054-technical-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install dependencies and emit lockfile for bounded reproducibility correction
        run: |
          npm install --no-audit --no-fund
          echo "WORK_YUZU_054_LOCKFILE_BASE64_BEGIN"
          base64 -w 0 package-lock.json
          echo
          echo "WORK_YUZU_054_LOCKFILE_BASE64_END"

      - name: Verify foundation
        run: npm run check
