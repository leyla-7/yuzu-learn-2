name: Technical foundation CI

on:
  push:
    branches:
      - main
      - work-yuzu-054-technical-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install dependencies for bounded lockfile generation
        run: npm install --no-audit --no-fund

      - name: Verify foundation
        run: npm run check

      - name: Commit generated lockfile
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "fix: commit WORK-YUZU-054 dependency lockfile"
          git push origin HEAD:work-yuzu-054-technical-foundation
