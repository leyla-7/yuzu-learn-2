name: Technical foundation CI

on:
  push:
    branches:
      - main
      - work-yuzu-054-technical-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install dependencies for bounded lockfile generation
        run: npm install --no-audit --no-fund

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: work-yuzu-054-package-lock
          path: package-lock.json

      - name: Verify foundation
        run: npm run check
